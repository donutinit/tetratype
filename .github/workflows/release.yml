name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and attach the extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run check

      - name: Package
        run: bun run build:zip

      - name: Attach the build to the release
        uses: softprops/action-gh-release@v2
        with:
          files: web-ext-artifacts/tetratype.zip
          generate_release_notes: true

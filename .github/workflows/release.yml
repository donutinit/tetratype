name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and attach the extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run check

      - name: Package
        run: bun run build:zip

      # Hand-written notes live in .github/release-notes/<tag>.md when a release
      # deserves them; otherwise GitHub generates them from the commit log.
      - name: Look for hand-written release notes
        id: notes
        run: |
          file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$file" ]; then
            echo "path=$file" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: web-ext-artifacts/tetratype.zip
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.generate }}

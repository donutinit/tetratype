name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint and format check
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build extension
        run: bun run build

      - name: Validate manifest with web-ext
        run: bunx --bun web-ext lint --source-dir dist --self-hosted

      - name: Upload unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: tetratype-unpacked
          path: dist/
          if-no-files-found: error
